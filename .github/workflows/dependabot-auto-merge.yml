name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge trusted Dependabot updates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Merge every eligible Dependabot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          merged=0

          mapfile -t pull_requests < <(
            gh api \
              "repos/$REPOSITORY/pulls?state=open&base=$default_branch&sort=created&direction=asc&per_page=100" \
              --jq '.[].number'
          )

          for pull_number in "${pull_requests[@]}"; do
            if ! pull=$(gh api "repos/$REPOSITORY/pulls/$pull_number"); then
              echo "Skipping PR #$pull_number because GitHub temporarily failed to return it"
              continue
            fi
            author=$(jq -r '.user.login' <<<"$pull")
            head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pull")
            head_ref=$(jq -r '.head.ref' <<<"$pull")
            head_sha=$(jq -r '.head.sha' <<<"$pull")
            title=$(jq -r '.title' <<<"$pull")

            [[ "$author" == 'dependabot[bot]' ]] || continue
            [[ "$head_repo" == "$REPOSITORY" ]] || continue
            [[ "$head_ref" == dependabot/* ]] || continue
            [[ $(jq -r '.draft' <<<"$pull") == false ]] || continue

            if ! files=$(gh api \
                 "repos/$REPOSITORY/pulls/$pull_number/files?per_page=100"); then
              echo "Skipping PR #$pull_number because GitHub temporarily failed to return its files"
              continue
            fi
            if ! jq -e '
              length > 0
              and length < 100
              and all(.[].filename;
                . == "requirements.txt"
                or . == "requirements-dev.txt"
                or . == "docker-compose.yml"
                or test("(^|/)(Dockerfile|Containerfile)(\\.[^/]*)?$"; "i")
                or test("^\\.github/workflows/[^/]+\\.ya?ml$")
              )
            ' <<<"$files" >/dev/null; then
              echo "Skipping PR #$pull_number because it changes non-dependency files"
              continue
            fi

            if ! commits=$(gh api \
                 "repos/$REPOSITORY/pulls/$pull_number/commits?per_page=100"); then
              echo "Skipping PR #$pull_number because GitHub temporarily failed to return its commits"
              continue
            fi
            if ! jq -e '
              length > 0
              and length < 100
              and all(.[]; .author.login == "dependabot[bot]")
              and all(.[]; .commit.verification.verified == true)
            ' <<<"$commits" >/dev/null; then
              echo "Skipping PR #$pull_number because its commits are not trusted Dependabot commits"
              continue
            fi

            mergeable=null
            for _ in {1..12}; do
              if ! pull=$(gh api "repos/$REPOSITORY/pulls/$pull_number"); then
                mergeable=unknown
                break
              fi
              [[ $(jq -r '.state' <<<"$pull") == open ]] || break
              [[ $(jq -r '.head.sha' <<<"$pull") == "$head_sha" ]] || break
              mergeable=$(jq -r '.mergeable' <<<"$pull")
              [[ "$mergeable" != null ]] && break
              sleep 5
            done
            if [[ "$mergeable" != true ]]; then
              echo "Skipping PR #$pull_number because GitHub currently reports mergeable=$mergeable"
              continue
            fi

            commit_title="$title (#$pull_number)"
            if ! response=$(gh api --method PUT \
                 "repos/$REPOSITORY/pulls/$pull_number/merge" \
                 -f merge_method=squash \
                 -f sha="$head_sha" \
                 -f commit_title="$commit_title" 2>&1); then
              echo "Skipped PR #$pull_number because GitHub rejected the merge: $response"
              continue
            fi
            if jq -e '.merged == true and .sha != null' \
                 <<<"$response" >/dev/null; then
              merge_sha=$(jq -r '.sha' <<<"$response")
              echo "Merged PR #$pull_number as $merge_sha"
              merged=$((merged + 1))
            else
              message=$(jq -r '.message // "merge rejected"' <<<"$response")
              echo "Skipped PR #$pull_number: $message"
            fi
          done

          if (( merged > 0 )); then
            gh workflow run docker-build.yml \
              --repo "$REPOSITORY" --ref "$default_branch"
            gh workflow run codeql.yml \
              --repo "$REPOSITORY" --ref "$default_branch"
            echo "Merged $merged Dependabot PR(s); dispatched post-merge Docker and CodeQL workflows"
          else
            echo "No eligible Dependabot PR required merging"
          fi
