name: Auto-merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master]

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  dependabot-auto-merge:
    if: >
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Enable auto-merge and delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --repo "$GH_REPO"; then
            exit 0
          fi

          gh pr checks "$PR_NUMBER" --required --watch --repo "$GH_REPO" || true
          gh pr merge "$PR_NUMBER" --squash --delete-branch --repo "$GH_REPO"
