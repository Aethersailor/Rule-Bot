name: Build and Push Docker Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: aethersailor/rule-bot

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run static checks
        run: |
          python -m compileall -q src tests tools
          ruff check src tests tools
          pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Rule Bot
            org.opencontainers.image.description=Telegram bot for rule management
            org.opencontainers.image.vendor=AetherSailor

      - name: Build and optionally push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:latest"
          for attempt in {1..12}; do
            manifest="$(docker buildx imagetools inspect "$image" --raw 2>/dev/null || true)"
            if jq -e '
              ([.manifests[]?.platform | select(.os == "linux") | .architecture] | index("amd64")) != null
              and
              ([.manifests[]?.platform | select(.os == "linux") | .architecture] | index("arm64")) != null
            ' <<<"$manifest" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "latest manifest does not contain amd64 and arm64" >&2
          exit 1

      - name: Remove every Docker Hub tag except latest
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg username "$DOCKERHUB_USERNAME" \
            --arg password "$DOCKERHUB_TOKEN" \
            '{username: $username, password: $password}')"
          jwt="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            https://hub.docker.com/v2/users/login/ | jq -er '.token // .access_token')"
          tags="$(curl --fail --silent --show-error \
            -H "Authorization: JWT $jwt" \
            'https://hub.docker.com/v2/repositories/aethersailor/rule-bot/tags?page_size=100' \
            | jq -r '.results[].name')"
          while IFS= read -r tag; do
            if [[ -n "$tag" && "$tag" != "latest" ]]; then
              curl --fail --silent --show-error -X DELETE \
                -H "Authorization: JWT $jwt" \
                "https://hub.docker.com/v2/repositories/aethersailor/rule-bot/tags/$tag/"
            fi
          done <<<"$tags"
